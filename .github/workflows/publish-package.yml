name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohamedosamaai'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Build Monorepo
        run: npm run build

      - name: Pack Distribution Tarballs
        id: pack
        run: |
          node -e '
            const fs = require("fs");
            for (const [dir, name] of [
              ["packages/core", "@mohamedosamaai/bagback-download-core"],
              ["packages/downloader-engine", "@mohamedosamaai/bagback-download-engine"]
            ]) {
              const file = dir + "/package.json";
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.name = name;
              pkg.repository = { type: "git", url: "git+https://github.com/mohamedosamaai/bagback-download.git" };
              pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
          '
          CORE_TAR=$(cd packages/core && npm pack)
          ENGINE_TAR=$(cd packages/downloader-engine && npm pack)
          echo "core_tar=packages/core/$CORE_TAR" >> $GITHUB_OUTPUT
          echo "engine_tar=packages/downloader-engine/$ENGINE_TAR" >> $GITHUB_OUTPUT

      - name: Attest Core Package Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pack.outputs.core_tar }}

      - name: Attest Engine Package Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pack.outputs.engine_tar }}

      - name: Publish Core Package
        run: |
          npm publish ${{ steps.pack.outputs.core_tar }} --access public || echo "Core package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Engine Package
        run: |
          npm publish ${{ steps.pack.outputs.engine_tar }} --access public || echo "Engine package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
